<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buildloom — Universal Web Animation & Component Engine</title>

  <!-- Google Fonts: Antonio & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --sky-wash: #dceeff;
      --paper-white: #ffffff;
      --carbon: #000000;
      --mint-pop: #55db9c;
      --sunburst: #ffd731;
      --electric-blue: #4da2ff;
      --ember: #fb4903;
      --lavender: #e9ccff;
      --font-display: 'Antonio', sans-serif;
      --font-body: 'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--sky-wash);
      color: var(--carbon);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .hero-box {
      background: var(--paper-white);
      border: 4px solid var(--carbon);
      border-radius: 36px;
      padding: 48px;
      max-width: 800px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      box-shadow: 0 0 0 0 transparent;
      animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-tag {
      background: var(--mint-pop);
      border: 2px solid var(--carbon);
      padding: 8px 20px;
      border-radius: 1600px;
      font-weight: 800;
      font-size: 14px;
      text-transform: uppercase;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: 64px;
      line-height: 0.85;
      text-transform: uppercase;
      letter-spacing: -1.5px;
    }

    .hero-desc {
      font-size: 18px;
      font-weight: 500;
      color: #333;
      max-width: 620px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      width: 100%;
      margin-top: 8px;
    }

    .btn {
      background: var(--electric-blue);
      color: #fff;
      border: 3px solid var(--carbon);
      padding: 16px 32px;
      border-radius: 1600px;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn:hover {
      background: var(--sunburst);
      color: var(--carbon);
      transform: translateY(-3px) scale(1.02);
    }

    .btn-secondary {
      background: var(--lavender);
      color: var(--carbon);
    }

    @keyframes floatUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="hero-box">
    <div class="brand-tag">★ BUILDLOOM ENGINE ONLINE</div>
    <h1 class="hero-title">BUILDLOOM ENGINE</h1>
    <p class="hero-desc">
      The World's Premier Interactive Web Animation & Shader Engine containing <strong>282 curated component animation labs</strong>, 3D WebGL scenes, physics engines, and smooth scroll effects.
    </p>

    <div class="btn-group">
      <a href="dashboard/index.html" class="btn">Launch 282 Component Showcase ★</a>
      <a href="PLANS.html" class="btn btn-secondary">View Business Plan & Specs ★</a>
    </div>
  </div>
</body>
</html>
